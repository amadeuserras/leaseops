name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leaseops
          POSTGRES_PASSWORD: leaseops
          POSTGRES_DB: leaseops
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Create test databases
        env:
          PGPASSWORD: leaseops
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          createdb -h localhost -p 5434 -U leaseops leaseops_test
          createdb -h localhost -p 5434 -U leaseops leaseops_evals

      - name: Pytest
        run: uv run pytest
        env:
          CORS_ORIGINS: '["http://localhost:3000"]'
          DATABASE_URL: postgresql+asyncpg://leaseops:leaseops@localhost:5434/leaseops
          TEST_DATABASE_URL: postgresql+asyncpg://leaseops:leaseops@localhost:5434/leaseops_test
          EVALS_DATABASE_URL: postgresql+asyncpg://leaseops:leaseops@localhost:5434/leaseops_evals
          JWT_SECRET: ci-placeholder
          ANTHROPIC_API_KEY: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
          LEASECLEAR_BASE_URL: http://localhost:8000
