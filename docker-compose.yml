services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: leaseops
      POSTGRES_PASSWORD: leaseops
      POSTGRES_DB: leaseops
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaseops -d leaseops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
