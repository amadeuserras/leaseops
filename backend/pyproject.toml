[project]
name = "leaseops"
version = "0.1.0"
description = "AI maintenance-inbox agent with gated writes, MCP tools, and trajectory evals"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "pydantic-settings>=2.14",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "uvicorn[standard]>=0.32",
    "mcp[cli]>=1.27,<2",
    "httpx>=0.28",
    "langgraph>=1.2.9",
    "openai>=2.47.0",
    "anthropic>=0.118.0",
    "langgraph-checkpoint-postgres>=3.1.0",
]

[dependency-groups]
dev = [
    "grandalf>=0.8",
    "pyright>=1.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
per-file-ignores = { "**/tests/**/*.py" = ["E501"] }

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
